# =============================================================================
# Leti - Core Settings
# =============================================================================

app:
  name: "Leti"
  wake_word: "hey_leti"          # must match a trained/available openwakeword model name
  wake_word_threshold: 0.5
  log_level: "INFO"              # DEBUG | INFO | WARNING | ERROR

ollama:
  host: "http://localhost:11434"
  # Tool-calling capable model. The choice is bounded by VRAM, and the binding
  # constraint is not the weights - it is the context window the tool list below
  # forces (see num_ctx). Measured against a 12GB card:
  #
  #   qwen2.5:7b   4.4 GiB weights + 1.3 GiB KV @ 24576 = ~6.1 GiB   fits, ~4 GiB spare
  #   qwen2.5:14b  8.4 GiB weights + 2.4 GiB KV (q8_0)  = ~11.4 GiB  does not fit
  #
  # A 12GB card under Windows only offers ~10.5-11 GiB to Ollama once the desktop
  # compositor has taken its share, so the 14b overflows and Ollama silently moves
  # layers onto the CPU - which on a mid-range chip turns an eight-iteration tool
  # turn into minutes. 7b is the honest default for 12GB. If you have 16GB of VRAM
  # or more, put "qwen2.5:14b" back here: it is the better model at picking from
  # 100+ tools, and it fits there with room to spare.
  reasoning_model: "qwen2.5:7b"
  # Only used when the primary is unreachable or was never pulled - not an
  # out-of-memory fallback. mistral-nemo is larger than the primary; on a 12GB
  # card it will run partly on the CPU if it is ever actually reached.
  fallback_reasoning_model: "mistral-nemo"
  vision_model: "llama3.2-vision"
  embedding_model: "nomic-embed-text"
  request_timeout_seconds: 120
  temperature: 0.3
  # num_ctx is the model's context window. Ollama defaults to a conservative
  # value (often 2048-4096) when this isn't set explicitly, regardless of what
  # the model itself supports. If num_ctx is too small, Ollama silently truncates
  # the request rather than erroring, and the model effectively "forgets"
  # whichever tools didn't make the cut - it looks exactly like the model not
  # knowing a tool exists, with no error anywhere to point at the real cause.
  #
  # Every tool schema is sent on every call, and on every iteration of the
  # tool-calling loop (core/orchestrator.py). Measured, not estimated: 103 tools
  # serialise to 63,410 characters, which is roughly 16,000-18,000 tokens. This
  # comment used to say 9,000 and 16384 used to be enough; the tool count grew
  # past it, which is exactly the silent failure described above. main.py logs a
  # warning at startup if this number stops being big enough again, so the next
  # time it happens it says so instead of looking like a stupid model.
  #
  # Raised from 24576 to 28672 when the tool count went 103 -> 119 (watches and
  # the controlled GUI mode): 119 schemas are ~18,900 tokens, and 24576 no longer
  # left enough behind them. This leaves ~9,700 for the system prompt,
  # personality, user profile, recalled memories, the rolling conversation buffer
  # and accumulated tool results. Don't go below ~24576 while the list is this
  # size. On a 12GB card this costs ~0.22 GiB more KV cache with qwen2.5:7b
  # (1.31 -> 1.53 GiB), which still leaves roughly 4 GiB spare. Raising it
  # costs VRAM for the KV cache whether or not a turn uses it - see the model
  # note above, and README's Windows section for halving that cost with
  # OLLAMA_KV_CACHE_TYPE.
  num_ctx: 28672
  max_tool_iterations: 8          # cap on chained tool calls per user turn

stt:
  model_size: "base.en"            # tiny.en/base.en/small.en/medium.en/large-v3
  # "auto" | "cpu" | "cuda". auto uses the GPU when torch reports a working CUDA
  # build and falls back to the CPU when it doesn't - asking for "cuda" on a
  # CPU-only torch (which is what plain `pip install openai-whisper` gives you on
  # Windows) used to be a crash at startup. base.en costs ~200MB of VRAM.
  device: "auto"
  fp16: "auto"                     # auto = on for CUDA, off for CPU (which can't do it)
  silence_timeout_seconds: 1.2

tts:
  voice_id: ""                     # leave blank for system default; see README to list available voice IDs
  rate: 180                        # words per minute
  volume: 1.0                      # 0.0 - 1.0
  interruptible: true

memory:
  persist_dir: "./data/chroma"
  sqlite_path: "./data/leti.db"
  session_buffer_max_turns: 20
  long_term_top_k: 5

vision:
  screenshot_dir: "./data/screenshots"
  max_screenshot_age_seconds: 5    # reuse cached capture within this window
  downscale_width: 1280            # resize before sending to vision model
  keep_screenshots: 20             # older captures are deleted after each new one

# Which tools each request is shown. Every tool stays registered, executable and
# authorised exactly as before - this only decides which schemas are sent to the
# model, because sending all 103 of them costs roughly 16,000 tokens of a 24,576
# token window on every single call. See core/tool_router.py.
#
# Set this to false to go back to sending the complete tool list on every request.
# Nothing else changes with it: routing already falls back to the full set on its
# own whenever it is uncertain, finds no match, or hits an error.
tool_routing:
  enabled: true

safety:
  # Which classes of action stop and ask you first. Tools are classified by what
  # they do in config/permissions.yaml: read, execute, modify, external, critical.
  #   - Add "execute" if you want to approve every search, calculation and code run.
  #   - Remove "modify" if you trust Leti with files on this machine unprompted.
  # "critical" always asks whether or not it's listed - a setting that could turn
  # off the prompt for irreversible actions would defeat the point of having one.
  require_confirmation_for: ["modify", "external", "critical"]
  confirmation_timeout_seconds: 15
  # If true, every risky/destructive tool call is reported instead of performed:
  # Leti describes what it would have done and nothing changes on the system.
  # Read-only "safe" tools still run, so research/planning behaves normally.
  dry_run: false
  audit_log_path: "./logs/audit.log"

# Project workspaces (see tools/projects.py). Each project is a real folder here,
# so you can open it in a file manager; nesting is a real directory hierarchy.
projects:
  root: "./data/projects"

# Scheduled tasks (see tools/scheduler.py). A task that fails this many times in
# a row is disabled automatically and the failure reported, rather than failing
# quietly forever.
scheduler:
  disable_after_failures: 5
  # What a task may do when it runs with nobody present - i.e. started by the
  # machine's own scheduler while Leti is closed. Reading, computing and writing
  # files cover what people actually schedule (research, analysis, reports).
  # "external" (sending mail, posting, deploying) and "critical" (irreversible)
  # are left out on purpose: an action nobody can decline shouldn't be taken on
  # your behalf while you're away. "critical" is refused even if you add it.
  unattended_allows: ["read", "execute", "modify"]
#   file_path: "./data/scheduled_tasks.json"

# Business records (see tools/business.py). stage_weights is what each pipeline
# stage is worth when weighting the pipeline - the defaults are conventional
# sales-funnel probabilities; set your own if your business converts differently.
# business:
#   file_path: "./data/business.json"
#   stage_weights:
#     new: 0.10
#     contacted: 0.20
#     qualified: 0.40
#     proposal: 0.60
#     negotiation: 0.80

paths:
  data_dir: "./data"
  logs_dir: "./logs"

# -----------------------------------------------------------------------------
# Email - IMAP (read) + SMTP (send) over SSL with an app password.
# Most providers (Gmail, Outlook, iCloud) require an "app password" rather
# than your normal login password once 2FA is on - generate one in your
# account security settings and put it here, not your real password.
# Leave this whole section commented out / absent to disable email tools.
# -----------------------------------------------------------------------------
# email:
#   imap_host: "imap.gmail.com"
#   imap_port: 993
#   smtp_host: "smtp.gmail.com"
#   smtp_port: 465
#   username: "you@gmail.com"
#   app_password: "xxxx xxxx xxxx xxxx"
#   vip_senders:            # substrings matched against the From header - always "crucial"
#     - "boss@work.com"
#     - "hr@work.com"

# -----------------------------------------------------------------------------
# Trading - Alpaca PAPER (simulated) account only. This is enforced in
# tools/trading_platform.py by hardcoding the paper API endpoints, not by
# this config - so there is no setting here that can turn this into live
# trading with real money. Sign up for a free paper account at
# https://alpaca.markets and use its paper API key/secret (not live keys).
# -----------------------------------------------------------------------------
# trading:
#   api_key: "YOUR_ALPACA_PAPER_KEY"
#   api_secret: "YOUR_ALPACA_PAPER_SECRET"
#   watchlist:
#     - "AAPL"
#     - "TSLA"
#     - "BTC/USD"

# -----------------------------------------------------------------------------
# Contacts - lets Leti resolve a name mentioned in conversation ("email
# stavros") to the right saved contact, disambiguating between people who
# share a name using tags/notes ("stavros the mechanic" vs "stavros the
# plumber"). See tools/contacts.py. Stored at data/contacts.json by default.
# -----------------------------------------------------------------------------
# contacts:
#   file_path: "./data/contacts.json"

# -----------------------------------------------------------------------------
# Calendar - CalDAV (works with Google Calendar, iCloud, Nextcloud, Fastmail,
# and most other providers) using an app password, the same shape as the
# email section above rather than a full OAuth2 browser consent flow.
#   Google:   caldav_url "https://apidata.googleusercontent.com/caldav/v2/<your-email>/events"
#   iCloud:   caldav_url "https://caldav.icloud.com" (username = Apple ID, app password required)
#   Nextcloud/Fastmail: check their CalDAV docs for the exact URL.
# calendar_name is optional - defaults to the first calendar found.
# -----------------------------------------------------------------------------
# calendar:
#   caldav_url: "https://apidata.googleusercontent.com/caldav/v2/you@gmail.com/events"
#   username: "you@gmail.com"
#   app_password: "xxxx xxxx xxxx xxxx"
#   calendar_name: ""

# -----------------------------------------------------------------------------
# Zoom - Server-to-Server OAuth app (Zoom App Marketplace -> Develop -> Build
# App -> Server-to-Server OAuth). No per-user consent needed; the app acts as
# the account owner. Needs the "Meeting:Write" scope.
# -----------------------------------------------------------------------------
# zoom:
#   account_id: "YOUR_ZOOM_ACCOUNT_ID"
#   client_id: "YOUR_ZOOM_CLIENT_ID"
#   client_secret: "YOUR_ZOOM_CLIENT_SECRET"

# -----------------------------------------------------------------------------
# Microsoft Teams - Azure AD app registration with an application (not
# delegated) permission of OnlineMeetings.ReadWrite.All, admin-consented.
# organizer_user_id is the Microsoft 365 user/mailbox whose name the meeting
# is created under (find it via Graph: GET /users/<email> -> "id").
# -----------------------------------------------------------------------------
# teams:
#   tenant_id: "YOUR_AZURE_TENANT_ID"
#   client_id: "YOUR_APP_CLIENT_ID"
#   client_secret: "YOUR_APP_CLIENT_SECRET"
#   organizer_user_id: "YOUR_M365_USER_OBJECT_ID"

# -----------------------------------------------------------------------------
# System health - thresholds system_report flags as an issue. All optional;
# defaults are shown below and used for anything not overridden here.
# -----------------------------------------------------------------------------
# system_health:
#   thresholds:
#     cpu_percent: 90
#     memory_percent: 85
#     swap_percent: 60
#     disk_percent: 90
#     temperature_celsius: 85
#     battery_low_percent: 15

# -----------------------------------------------------------------------------
# Personalization - Leti's personality dials (data/personality.json) and the
# structured, editable memory of the user (data/user_profile.json). Both are
# plain JSON files you can hand-edit directly if you'd rather not go through
# conversation - see tools/personality.py and tools/user_profile.py.
# -----------------------------------------------------------------------------
# personality:
#   file_path: "./data/personality.json"
# user_profile:
#   file_path: "./data/user_profile.json"

# -----------------------------------------------------------------------------
# Social media - YouTube/Reddit need no login (Reddit works out of the box;
# YouTube needs a free API key). Instagram/TikTok/Facebook use a one-time
# interactive login instead of a stored password - see login_to_social_platform
# and tools/social_login.py. This is against those platforms' terms of
# service even for your own account; realistic risk is a security challenge
# or temporary lock if their bot-detection notices non-human patterns.
# -----------------------------------------------------------------------------
# social_media:
#   youtube:
#     api_key: "YOUR_YOUTUBE_DATA_API_V3_KEY"
#   reddit:
#     user_agent: "leti-personal-assistant/1.0 (by /u/your-reddit-username)"
#   watches_file_path: "./data/social_watches.json"

# -----------------------------------------------------------------------------
# Weather (GUI dashboard) - Open-Meteo needs no API key.
# Set latitude/longitude to say where you are. If you'd rather not, Leti can
# look your approximate location up from your IP instead - but that sends a
# request to a third party (ipapi.co) revealing your IP, so it's off unless you
# turn it on. With neither set, the weather tool says so rather than guessing.
# -----------------------------------------------------------------------------
# weather:
#   latitude: 37.7749
#   longitude: -122.4194
#   location_label: "San Francisco, CA"
#   unit: "celsius"   # or "fahrenheit"
#   allow_ip_geolocation: false

# -----------------------------------------------------------------------------
# To-do list (GUI dashboard) - shared storage between GUI checkbox clicks and
# conversational requests ("add X to my to-do list").
# -----------------------------------------------------------------------------
# todo_list:
#   file_path: "./data/todo_list.json"

# -----------------------------------------------------------------------------
# GUI web server (--mode gui) - what makes Leti reachable from your phone or any
# other device on the same network, not just this machine. Read the security
# note in gui/server.py before enabling this on a network you don't trust:
# loopback (this machine) is always trusted; anything else needs the printed
# token. This is LAN-only - never port-forward it to the internet.
# -----------------------------------------------------------------------------
# gui:
#   port: 8420
#   enable_remote_access: true   # set false to restrict the GUI to this machine only
#   token_file_path: "./data/gui_remote_token.txt"
