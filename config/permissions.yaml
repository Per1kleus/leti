# =============================================================================
# Leti - Permission & Risk Tiers
# =============================================================================

tools:
  web_search:
    action: execute

  read_screen:
    action: execute

  # Searches and reads public pages. Reversible, reaches nothing private.
  research_topic:
    action: execute

  read_file:
    action: read

  list_files:
    action: read

  write_file:
    action: modify

  delete_file:
    action: critical

  move_file:
    action: modify

  # `modify` rather than `execute` on purpose: launching starts an arbitrary
  # program, which can then do arbitrary things. "Open my browser" is harmless,
  # "launch /tmp/x" is not, and nothing here can tell them apart - so it asks, and
  # the confirmation is what makes it safe for the tool to be broadly capable
  # (apps, files, arguments).
  #
  # The one case that is not a program launch is a web address, which launch_app
  # hands to the user's own browser. That runs nothing on this machine, and it's
  # something people ask for many times a day - a prompt they see that often is a
  # prompt they stop reading, which costs more than it buys. So the tool reports
  # which case each call is (LaunchAppTool.action_case) and the two are priced
  # separately here. The tool names the situation; this file decides what it costs.
  # blocked_domains below applies to the page either way.
  launch_app:
    action: modify
    action_by_case:
      web_page: execute
      program: modify

  close_app:
    action: modify

  focus_window:
    action: execute

  mouse_click:
    action: modify

  keyboard_type:
    action: modify

  keyboard_hotkey:
    action: modify

  # A shell command can do anything the user can, and the forbidden-pattern list
  # is a blocklist, which can't be complete. Tiering it destructive doesn't add a
  # gate - risky and destructive both require confirmation - but it does change
  # what the prompt says, from "this will make a change" to "this can't be
  # undone", which is the honest description of an arbitrary command.
  run_shell_command:
    action: critical

  # Goes to a page and returns its visible text - the navigate step and the read
  # step are the same call.
  browser_read_page:
    action: execute

  browser_click:
    action: external

  browser_fill_form:
    action: external

  # --- Coding ---
  # Running code is `execute`: reversible, and the point of the tool is that Leti
  # tests what it writes rather than assuming it works. Code can of course do
  # anything - which is why it runs in a project folder and is logged, and why
  # anyone who wants to approve each run can add "execute" to
  # safety.require_confirmation_for.
  run_code:
    action: execute

  run_tests:
    action: execute

  inspect_project:
    action: read

  # Downloads and runs third-party code.
  install_dependency:
    action: external

  # --- Cybersecurity: network diagnostics (read-only) ---
  # Listening + established sockets, with the owning process for each.
  inspect_network_connections:
    action: execute

  check_firewall_status:
    action: execute

  list_lan_devices:
    action: execute

  check_startup_persistence:
    action: execute

  detect_brute_force_attempts:
    action: execute

  check_integrity:
    action: execute

  # --- Cybersecurity: active defense / remediation (changes system state) ---
  enable_firewall:
    action: modify

  kill_process:
    action: critical

  create_security_snapshot:
    action: modify

  restore_from_snapshot:
    action: critical

  # --- Email ---
  list_new_emails:
    action: execute

  send_email:
    action: external

  # --- Trading (paper/sandbox only - endpoints are hardcoded, never live) ---
  get_trading_watchlist:
    action: read

  set_trading_watchlist:
    action: execute

  get_market_quote:
    action: execute

  evaluate_trading_strategy:
    action: execute

  get_paper_positions:
    action: execute

  place_paper_order:
    action: external

  # --- Contacts ---
  add_contact:
    action: modify

  list_contacts:
    action: read

  resolve_contact:
    action: read

  update_contact:
    action: modify

  delete_contact:
    action: critical

  # --- Venture Scout / Red-Team / COO persona (pure text generation, no side effects) ---
  scout_find_trends:
    action: execute

  scout_stress_test:
    action: execute

  # --- Meeting scheduling (creates real calendar events / video meetings) ---
  schedule_meeting:
    action: external

  create_video_meeting_link:
    action: external

  send_meeting_invite_email:
    action: external

  # --- System health / performance / updates ---
  # Hardware specs, live health metrics and pending updates, by section.
  system_report:
    action: execute

  apply_system_updates:
    action: modify

  # --- Personalization: personality dials (tone only, no real-world effect) ---
  get_personality_settings:
    action: read

  set_personality:
    action: execute

  apply_personality_preset:
    action: execute

  reset_personality:
    action: execute

  # --- Personalization: user profile (low-stakes personal notes) ---
  remember_about_user:
    action: execute

  set_user_name:
    action: execute

  view_user_profile:
    action: read

  forget_user_fact:
    action: execute

  clear_user_profile:
    action: critical

  # --- Social media: YouTube + Reddit (official, read-only), watches ---
  add_social_watch:
    action: execute

  list_social_watches:
    action: read

  remove_social_watch:
    action: execute

  check_social_watches:
    action: execute

  # One tool for "what has this account/subreddit/page posted", across every
  # platform, and one for searching a platform by topic.
  get_social_content:
    action: execute

  search_social:
    action: execute

  # --- Social media: session-based login (Instagram/TikTok/Facebook) ---
  login_to_social_platform:
    action: external

  logout_social_platform:
    action: execute

  # --- Dashboard data sources ---
  get_weather:
    action: execute

  add_todo_item:
    action: execute

  list_todo_items:
    action: read

  complete_todo_item:
    action: execute

  delete_todo_item:
    action: execute

  # --- Scheduling ---
  # A scheduled task runs an instruction through the whole tool set later, without
  # the user present - so creating one is a `modify` action they confirm, and each
  # tool the task itself calls is still authorised normally when it fires.
  create_scheduled_task:
    action: modify

  update_scheduled_task:
    action: modify

  run_scheduled_task_now:
    action: execute

  list_scheduled_tasks:
    action: read

  delete_scheduled_task:
    action: modify

  # Registers or removes an entry in the machine's own scheduler (cron/launchd/
  # Task Scheduler), which then starts Leti without the user present.
  system_scheduling:
    action: external

  # --- Long-running tasks and workflows ---
  # These manage state; they never run a tool themselves. Every step they set off
  # goes back through the orchestrator, so the tools it reaches are authorised
  # here exactly as they would be for a typed request. That is why starting one is
  # only a `modify`: it is a plan being written down, not the plan being carried
  # out, and the carrying out is gated call by call.
  start_autonomous_task:
    action: modify

  list_autonomous_tasks:
    action: read

  control_autonomous_task:
    action: modify

  # Creating a workflow writes a draft and shows the user a preview. Nothing about
  # it runs, and nothing is scheduled, until activate_workflow.
  create_workflow:
    action: modify

  # Activation is the standing instruction taking effect - after this it can run
  # while the user is away, which is the same weight as create_scheduled_task.
  activate_workflow:
    action: modify

  list_workflows:
    action: read

  manage_workflow:
    action: modify

  run_workflow:
    action: execute

  # --- Watches ---
  # A watch only ever OBSERVES. Whatever it decides to do about what it saw goes
  # back through the orchestrator as a task, and is authorised there call by call -
  # detecting an email arriving is not permission to reply to it.
  create_watch:
    action: modify

  list_watches:
    action: read

  manage_watch:
    action: modify

  check_watches:
    action: read

  # --- Controlled GUI mode ---
  # These three decide the approach, check the screen and close a session. None of
  # them moves the mouse or types: that is mouse_click, keyboard_type and
  # focus_window, which keep their own action classes below. Driving the GUI is
  # therefore governed by the same rules as the equivalent tool, which is what
  # stops it becoming a way around them.
  choose_computer_approach:
    action: read

  verify_screen:
    action: read

  end_computer_session:
    action: read

  archive_project:
    action: modify

  # --- Business intelligence ---
  business_dashboard:
    action: read

  list_business_data:
    action: read

  business_next_actions:
    action: read

  record_business_data:
    action: modify

  update_lead:
    action: modify

  # --- Engineering ---
  # Pure computation - no files touched, nothing outside the process.
  engineering_calculate:
    action: execute

  convert_units:
    action: execute

  check_dimensions:
    action: execute

  solve_symbolic:
    action: execute

  # --- Data analysis ---
  # Reading and analysing don't change anything; the two that write a new file do.
  # None of them ever modify the source dataset.
  inspect_dataset:
    action: read

  analyze_dataset:
    action: execute

  clean_dataset:
    action: modify

  visualize_dataset:
    action: modify

  export_dataset:
    action: modify

  # --- Project workspaces ---
  create_project:
    action: modify

  list_projects:
    action: read

  get_project_context:
    action: read

  open_project:
    action: execute

  close_project:
    action: execute

  update_project:
    action: modify

  # Removes a folder and everything in it, with no recycle bin.
  delete_project:
    action: critical

  # --- Visual output (images, diagrams) ---
  search_images:
    action: execute

  create_sketch:
    action: execute

# Commands that are never allowed to run, even in "risky" mode, no matter the tool.
forbidden_shell_patterns:
  - "rm -rf /"
  - "rm -rf /*"
  - "mkfs"
  - ":(){ :|:& };:"          # fork bomb
  - "dd if=/dev/zero"
  - "> /dev/sda"
  - "shutdown"
  - "reboot"
  - "del /f /s /q C:\\"
  - "format C:"
  - "chmod -R 777 /"
  - "curl | sh"
  - "wget | sh"

# Absolute paths Leti must never touch (read or write).
#
# Enforced on canonical paths ('..' normalized, symlinks followed) and against
# paths named inside a shell command, not just path-shaped tool arguments.
#
# Worth extending: read_file is `safe` (no confirmation) and send_email is
# `risky` (one confirmation), so anything readable is one approval away from
# leaving the machine. The entries below cover the usual credential stores; add
# whatever else on this machine you'd never want read aloud or attached to an
# email - .env files, password manager exports, tax documents.
protected_paths:
  - "~/.ssh"
  - "~/.aws"
  - "~/.gnupg"
  - "/etc"
  - "/System"
  - "C:\\Windows"
  # Narrowed from all of C:\Users\*\AppData, which covers most of what a Windows
  # user has installed - VS Code, Discord, Spotify and Slack all live under
  # LocalAppData, so blocking the lot stopped Leti working with ordinary apps.
  # These are the parts that actually hold credentials.
  - "C:\\Users\\*\\AppData\\Local\\Google\\Chrome\\User Data"
  - "C:\\Users\\*\\AppData\\Roaming\\Mozilla\\Firefox\\Profiles"
  - "C:\\Users\\*\\AppData\\Local\\Microsoft\\Edge\\User Data"
  - "C:\\Users\\*\\AppData\\Local\\Microsoft\\Credentials"
  - "C:\\Users\\*\\AppData\\Roaming\\Microsoft\\Credentials"

# Domains the browser tool is not allowed to navigate to
blocked_domains: []
