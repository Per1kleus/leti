# =============================================================================
# Leti - Permission & Risk Tiers
# =============================================================================

tools:
  web_search:
    action: execute

  read_screen:
    action: execute

  # Searches and reads public pages. Reversible, reaches nothing private.
  research_topic:
    action: execute

  read_file:
    action: read

  list_files:
    action: read

  write_file:
    action: modify

  delete_file:
    action: critical

  move_file:
    action: modify

  # `modify` rather than `execute` on purpose: this starts an arbitrary program,
  # which can then do arbitrary things. "Open my browser" is harmless, "launch
  # /tmp/x" is not, and nothing here can tell them apart - so it asks, and the
  # confirmation is what makes it safe for the tool to be broadly capable (apps,
  # files, URLs, arguments).
  launch_app:
    action: modify

  # Hands an http(s) URL to the user's own default browser. Other schemes are
  # rejected by the tool, and blocked_domains below still applies.
  open_url:
    action: execute

  close_app:
    action: modify

  focus_window:
    action: execute

  mouse_click:
    action: modify

  keyboard_type:
    action: modify

  keyboard_hotkey:
    action: modify

  # A shell command can do anything the user can, and the forbidden-pattern list
  # is a blocklist, which can't be complete. Tiering it destructive doesn't add a
  # gate - risky and destructive both require confirmation - but it does change
  # what the prompt says, from "this will make a change" to "this can't be
  # undone", which is the honest description of an arbitrary command.
  run_shell_command:
    action: critical

  browser_navigate:
    action: execute

  # Read-only: returns the visible text of a page so Leti can answer from what it
  # says rather than from a search snippet.
  browser_read_page:
    action: execute

  browser_click:
    action: external

  browser_fill_form:
    action: external

  # --- Coding ---
  # Running code is `execute`: reversible, and the point of the tool is that Leti
  # tests what it writes rather than assuming it works. Code can of course do
  # anything - which is why it runs in a project folder and is logged, and why
  # anyone who wants to approve each run can add "execute" to
  # safety.require_confirmation_for.
  run_code:
    action: execute

  run_tests:
    action: execute

  inspect_project:
    action: read

  # Downloads and runs third-party code.
  install_dependency:
    action: external

  # --- Cybersecurity: network diagnostics (read-only) ---
  scan_local_ports:
    action: execute

  check_firewall_status:
    action: execute

  list_lan_devices:
    action: execute

  list_suspicious_processes:
    action: execute

  check_startup_persistence:
    action: execute

  detect_brute_force_attempts:
    action: execute

  check_integrity:
    action: execute

  # --- Cybersecurity: active defense / remediation (changes system state) ---
  enable_firewall:
    action: modify

  kill_process:
    action: critical

  create_security_snapshot:
    action: modify

  restore_from_snapshot:
    action: critical

  # --- Email ---
  list_new_emails:
    action: execute

  send_email:
    action: external

  # --- Trading (paper/sandbox only - endpoints are hardcoded, never live) ---
  get_trading_watchlist:
    action: read

  set_trading_watchlist:
    action: execute

  get_market_quote:
    action: execute

  evaluate_trading_strategy:
    action: execute

  get_paper_positions:
    action: execute

  place_paper_order:
    action: external

  # --- Contacts ---
  add_contact:
    action: modify

  list_contacts:
    action: read

  resolve_contact:
    action: read

  update_contact:
    action: modify

  delete_contact:
    action: critical

  # --- Venture Scout / Red-Team / COO persona (pure text generation, no side effects) ---
  scout_find_trends:
    action: execute

  scout_stress_test:
    action: execute

  # --- Meeting scheduling (creates real calendar events / video meetings) ---
  schedule_meeting:
    action: external

  create_video_meeting_link:
    action: external

  send_meeting_invite_email:
    action: external

  # --- System health / performance / updates ---
  get_system_specs:
    action: execute

  run_health_check:
    action: execute

  check_for_updates:
    action: execute

  apply_system_updates:
    action: modify

  # --- Personalization: personality dials (tone only, no real-world effect) ---
  get_personality_settings:
    action: read

  set_personality:
    action: execute

  apply_personality_preset:
    action: execute

  reset_personality:
    action: execute

  # --- Personalization: user profile (low-stakes personal notes) ---
  remember_about_user:
    action: execute

  set_user_name:
    action: execute

  view_user_profile:
    action: read

  forget_user_fact:
    action: execute

  clear_user_profile:
    action: critical

  # --- Social media: YouTube + Reddit (official, read-only), watches ---
  get_subreddit_posts:
    action: execute

  search_reddit:
    action: execute

  get_youtube_channel_latest:
    action: execute

  search_youtube_trending:
    action: execute

  add_social_watch:
    action: execute

  list_social_watches:
    action: read

  remove_social_watch:
    action: execute

  check_social_watches:
    action: execute

  # --- Social media: session-based login (Instagram/TikTok/Facebook) ---
  login_to_social_platform:
    action: external

  logout_social_platform:
    action: execute

  get_instagram_user_latest:
    action: execute

  get_tiktok_user_latest:
    action: execute

  get_facebook_page_latest:
    action: execute

  # --- Dashboard data sources ---
  get_weather:
    action: execute

  add_todo_item:
    action: execute

  list_todo_items:
    action: read

  complete_todo_item:
    action: execute

  delete_todo_item:
    action: execute

  # --- Project workspaces ---
  create_project:
    action: modify

  list_projects:
    action: read

  get_project_context:
    action: read

  open_project:
    action: execute

  close_project:
    action: execute

  update_project:
    action: modify

  # Removes a folder and everything in it, with no recycle bin.
  delete_project:
    action: critical

  # --- Visual output (images, diagrams) ---
  search_images:
    action: execute

  create_sketch:
    action: execute

# Commands that are never allowed to run, even in "risky" mode, no matter the tool.
forbidden_shell_patterns:
  - "rm -rf /"
  - "rm -rf /*"
  - "mkfs"
  - ":(){ :|:& };:"          # fork bomb
  - "dd if=/dev/zero"
  - "> /dev/sda"
  - "shutdown"
  - "reboot"
  - "del /f /s /q C:\\"
  - "format C:"
  - "chmod -R 777 /"
  - "curl | sh"
  - "wget | sh"

# Absolute paths Leti must never touch (read or write).
#
# Enforced on canonical paths ('..' normalized, symlinks followed) and against
# paths named inside a shell command, not just path-shaped tool arguments.
#
# Worth extending: read_file is `safe` (no confirmation) and send_email is
# `risky` (one confirmation), so anything readable is one approval away from
# leaving the machine. The entries below cover the usual credential stores; add
# whatever else on this machine you'd never want read aloud or attached to an
# email - .env files, password manager exports, tax documents.
protected_paths:
  - "~/.ssh"
  - "~/.aws"
  - "~/.gnupg"
  - "/etc"
  - "/System"
  - "C:\\Windows"
  # Narrowed from all of C:\Users\*\AppData, which covers most of what a Windows
  # user has installed - VS Code, Discord, Spotify and Slack all live under
  # LocalAppData, so blocking the lot stopped Leti working with ordinary apps.
  # These are the parts that actually hold credentials.
  - "C:\\Users\\*\\AppData\\Local\\Google\\Chrome\\User Data"
  - "C:\\Users\\*\\AppData\\Roaming\\Mozilla\\Firefox\\Profiles"
  - "C:\\Users\\*\\AppData\\Local\\Microsoft\\Edge\\User Data"
  - "C:\\Users\\*\\AppData\\Local\\Microsoft\\Credentials"
  - "C:\\Users\\*\\AppData\\Roaming\\Microsoft\\Credentials"

# Domains the browser tool is not allowed to navigate to
blocked_domains: []
