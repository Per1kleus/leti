<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable variant: Android crops launcher icons to the device's own shape
       (circle, squircle, teardrop), so the background is full-bleed square with
       no rounded corners of its own, and the mark is scaled to sit inside the
       guaranteed-visible safe zone - the centred circle of 80% diameter. -->
  <defs><radialGradient id="g" cx="50%" cy="40%" r="65%">
    <stop offset="0%" stop-color="#0f2f43"/><stop offset="100%" stop-color="#050b14"/></radialGradient></defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <g transform="translate(256,256) scale(0.86) translate(-256,-256)">
    <circle cx="256" cy="256" r="176" fill="none" stroke="#12384b" stroke-width="13"/>
    <path d="M 256 80 A 176 176 0 0 1 432 256" fill="none" stroke="#4fe3ff" stroke-width="17" stroke-linecap="round"/>
    <path d="M 256 432 A 176 176 0 0 1 80 256" fill="none" stroke="#4fe3ff" stroke-width="17" stroke-linecap="round" opacity="0.42"/>
    <g transform="translate(177,181)">
      <path d="M0 0 h40 v112 h118 v38 H0 Z" fill="#e8fbff"/>
      <g fill="#4fe3ff">
        <rect x="60" y="30" width="25" height="66" rx="12.5"/>
        <rect x="97" y="14" width="25" height="98" rx="12.5"/>
        <rect x="134" y="36" width="25" height="54" rx="12.5"/>
      </g>
    </g>
  </g>
</svg>
