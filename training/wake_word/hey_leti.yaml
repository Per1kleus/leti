# The configuration the shipped data/wake_words/hey_leti.onnx was trained with.
#
# Changing a number here and re-running train_model.py produces a different
# model, which is the point: this file is the record of what was actually done,
# not a set of suggestions. The seeds are part of it - the same seeds and the
# same pins in requirements.txt reproduce the same corpus.

model_name: hey_leti            # what the file is called, and therefore what
                                # app.wake_word in config/settings.yaml resolves

# WHAT IS BEING TRAINED
#
# The spellings are weights: the generator draws uniformly from the lines of
# positive_texts, so a phrase written sixty times is six times as likely as one
# written ten times. The alternatives are there because "Leti" is not an English
# word and people will not all guess the same vowel. espeak reads
#   "leti"   as  h ˈe ɪ   l ˈɛ ɾ i    (LEH-tee, the t flapped)
#   "leetee" as  h ˈe ɪ   l ˈiː ɾ iː  (LEE-tee)
#   "leddy"  as  h ˈe ɪ   l ˈɛ d i    (a fully voiced d, which is what the flap
#                                      becomes in careless speech)
# and all three are the name as somebody might actually say it. A model trained
# on only the first answers to one pronunciation and ignores the user who picked
# another.
target_phrase: "hey leti"
positive_texts: data/positive_texts.txt
positive_phrases:                 # phrase: how many of every hundred draws
  "hey leti": 58
  "hey, leti": 10
  "hey leti.": 6
  "hey leti!": 3
  "hey leti?": 2
  "hey leetee": 11
  "hey, leetee": 2
  "hey leddy": 8

# The spelling CMUdict is asked about when searching for phonetic neighbours.
# "leti" is not in it; "letty" is, and is pronounced the same. No clip is ever
# generated from this - see prepare_negatives.phonetic_neighbours.
neighbour_seed_phrase: "hey letty"

# THE NEGATIVE HALF
#
# Three channels, because false positives come from three different places. See
# prepare_negatives.py for how each corpus is built and why none of it is
# downloaded.
adversarial_texts: data/adversarial_texts.txt      # phonetic neighbours
negative_texts: data/negative_short.txt            # prose and word sequences
fp_stream_texts: data/negative_long.txt            # the continuous stream the
                                                   # false-positive rate is
                                                   # measured against

# HOW MUCH
#
# openWakeWord's own guidance is at least 20,000 positive samples, which is what
# this is. The validation counts are smaller because they only have to measure.
n_positive: 20000
n_positive_val: 2500
n_adversarial: 20000
n_adversarial_val: 2500
n_negative_speech: 24000
n_negative_speech_val: 2500
n_fp_stream_clips: 2000         # about two and a half hours of continuous speech

# How many clips one generation process makes before it exits and the next one
# starts. Not a tuning knob - a bound. A generation process's resident memory
# climbs about 3 MB per clip through heap fragmentation (not a leak: the live
# object and tensor counts are flat), and four unbounded ones at once were
# OOM-killed 9,728 clips into this corpus. 400 keeps a process under about 2 GB.
# It is part of the corpus definition, because each chunk is separately seeded:
# changing it changes what gets generated.
clips_per_process: 400

# ...except where the clips are longer. Memory grows with the audio produced, not
# with the number of files: fp_stream speaks whole sentences from negative_long.txt
# and averages 4.4 seconds a clip against 1.5 for the rest, so it grows about three
# times as fast and 400 of them was still an OOM kill (exit -9, 272 of 400 clips).
# A third of the chunk size for three times the clip length.
clips_per_process_overrides:
  fp_stream: 100

# Every clip above is spoken by a speaker drawn from one half of a split of
# LibriTTS-R's 904 voices, and every validation clip by a speaker from the other
# half. See generate_clips.speaker_split: one voice in five is held out, and the
# last 104 are used by neither because piper-sample-generator's own README warns
# they produce artefacts.
usable_speakers: 800
holdout_every: 5

# The accents espeak can pronounce with this checkpoint's phoneme set. Each one
# changes the phonemes rather than the speaker, which is most of what an accent
# is. Checked at generation time - see generate_clips.usable_voices.
accents:
  - en-us
  - en-gb-x-rp
  - en-gb-scotland
  - en-029
  - en-gb-x-gbclan
  - en-gb-x-gbcwmd
  - en-us-nyc
  - en

# AUGMENTATION
#
# openWakeWord's own augment_clips does this, with its own default
# probabilities. The two corpora it needs are built locally.
# The signal-to-noise ratio the background clips are mixed in at, in decibels.
#
# openWakeWord's augment_clips hardcodes (-10, 15), where a negative value means
# the background is LOUDER than the speech. Changed, on the measurement below -
# recall of a logistic regression on the features, trained on training-speaker
# clips and tested on held-out-speaker clips, two seeds each, babble excluded:
#
#     0 to 15 dB      0.909 / 0.927       5.2% / 4.8% of positives unrecognisable
#     5 to 20 dB      0.944 / 0.965       3.4% / 1.6%
#    10 to 25 dB      0.951 / 0.976       2.0% / 1.1%
#
# against 0.990 with no augmentation at all. 5 to 20 is the choice: it recovers
# almost all of the recall while still putting noise only five decibels below the
# speech, which is a genuinely noisy room. 10 to 25 buys one more point of recall
# by training on gentler noise than this would then be claiming robustness to.
background_snr_db: [5.0, 20.0]

n_backgrounds: 160
background_seconds: 10.0
n_impulse_responses: 48
augmentation_rounds: 1
# Extra passes over particular corpora. Each pass re-augments the same clips with
# fresh draws, so three rounds of 20,000 positives is 60,000 differently-noised,
# differently-reverberated, differently-placed examples of the wake word from the
# same 640 voices. Recall is what this model is short of, and this is the cheapest
# honest way to buy some: no new speech to synthesise, only features to compute.
augmentation_rounds_overrides:
  positive_train: 3
augmentation_batch_size: 128

# TRAINING
#
# openWakeWord's own model definition and training loop. `steps` and
# `max_negative_weight` are its own defaults for a custom model; the three
# sequences, the learning-rate schedule and the checkpoint merge are its
# auto_train, reproduced in train_model.py only so that the length of the
# false-positive validation set is the real one rather than the 11.3 hours
# auto_train hard-codes.
model_type: dnn
# 32 hidden units was openWakeWord's example value and it does not learn this wake
# word at all. Probed against identical features, 8,000 steps, best recall reached
# inside the 0.2 false-positives-per-hour target:
#
#     layer  blocks  weight   pos:adv:neg    recall
#        32       1    1500     50:50:500     0.001
#       128       1    1500     50:50:500     0.194
#       128       1     200     50:50:500     0.294
#
# Those were measured before the background-noise fault below was found, so they
# rank the settings rather than predict the result.
# 256 units in two blocks: the best merged recall of the four widths tried on
# corrected features (0.882 against 0.861 for 128x1 at the same weight).
layer_size: 256
n_blocks: 2
steps: 50000
# Measured over thresholds, which is the only way this number means anything: the
# shipped threshold is chosen from measurements, so a weight tuned to make the model
# timid at 0.5 just moves the same curve. 1000 gave the best recall at every
# false-positive rate worth operating at; 8000 cost 0.08 recall for nothing.
max_negative_weight: 1000
target_false_positives_per_hour: 0.2
batch_n_per_class:
  positive: 150
  adversarial_negative: 100
  negative_speech: 200
  # Windows cut from continuous speech rather than from padded clips. This is the
  # channel openWakeWord fills from hundreds of hours of real-world audio and the one
  # that could not be downloaded here, so it is built locally by concatenating the
  # negative speech clips - see train_model.stream_windows. Without it the model had
  # never seen a window that starts and ends mid-word, which is what every window of
  # the false-positive stream is: 7.6 false positives an hour against a 0.2 target.
  negative_stream: 300
  # Noise with nothing said in it. Without this the model fires on mains hum every
  # time and on held tones two thirds of the time, because the only way it had ever
  # met either was underneath its own wake word: see train_model.train.
  noise_stream: 100

# How many of the negative-speech clips to concatenate into that continuous stream.
# 6,000 clips is about 3.7 hours, which is 168,000 windows at one frame apart.
n_negative_stream_clips: 6000

# The noise-alone negative corpus. A third seed, so it is disjoint from both the
# augmentation backgrounds (800) and the held-out noise the validation measures
# against (1800) - a negative the model trains on must not be a negative the report
# claims to have tested on.
n_noise_negative_clips: 400
seed_noise_negatives: 2800

# Seeds. Changing one changes the corpus; leaving them alone reproduces it.
seed_positive: 100
seed_positive_val: 200
seed_adversarial: 300
seed_adversarial_val: 400
seed_negative_speech: 500
seed_negative_speech_val: 600
seed_fp_stream: 700
seed_backgrounds: 800
seed_impulses: 900
seed_torch: 1234
